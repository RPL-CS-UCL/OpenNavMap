# 物体关联与融合的全部可调参数（本子包的默认值）。
#
# 调用方（apexnav-ros1 的 object_mapping、opengoalnav 的 sim_goatbench 等）自己的
# 配置文件里同名的段会覆盖这里，覆盖是按"整段合并、逐键取调用方的值"来的，
# 所以调用方只写想改的那几个键就行。
#
# 感知那一侧的参数（检测器、分割器、特征提取、深度过滤、单次观测的权重）
# 不在这里 —— 那些跟具体传感器和模型绑死，归调用方管。

fuse:
  voxel: 0.01                   # 点云降采样格子边长（米）：1 cm 一个格子，一格只留一个点
  max_points_per_object: 20000  # 一个物体最多攒这么多点

# 判断"这次看到的和地图里已有的是不是同一个物体"
assoc:
  # 下面两个只有 boxfusion（原版 ObjectGraph.integrate_observation）在用
  iou_threshold: 0.3      # 两个 3D 框的交并比（交集体积 / 并集体积）要超过它
  embedding_threshold: 0.7  # 且视觉特征的余弦相似度要超过它
  # 下面是 pointfusion 用的
  score_thresh: 0.55      # 综合得分超过它才算同一个
  dist_max: 1.0           # 两个中心最远差多少米还可能是同一个（会按物体大小放宽）
  dist_scale: 0.5         # 放宽幅度：允许距离 = max(dist_max, dist_scale × 物体对角线长)
  z_slack: 0.05           # 高度区间比较时的容差（米），挡掉"桌上的杯子被并进桌子"
  overlap_tau: 0.05       # 判断两片点云重不重合时的邻域半径（米）；后处理合并也用它
  w_iou: 0.35             # 综合得分里，两个框重叠度占的分量
  w_overlap: 0.35         # 两片点云重合比例占的分量（薄物体靠它，框重叠对薄物体没用）
  w_emb: 0.20             # 长得像不像占的分量
  w_label: 0.10           # 标签完全一样加的分

# 全部帧跑完之后的一遍全局整理
post:
  dbscan_eps: 0.1         # 点云聚类的邻域半径（米）
  dbscan_min_samples: 10  # 一个点周围至少这么多邻居才算"实心"，否则算噪点
  min_observations: 2     # 只被看到过 1 次的物体丢掉（多半是误检）
  min_points: 40          # 点数太少的丢掉
  merge_overlap: 0.5      # 同类两个物体点云重合超过一半 -> 合并（补关联时漏合的）
  merge_iou: 0.4          # 或者框重叠超过这个也合并
  merge_cross_label: true   # 允许把"点云几乎完全重合、但被检成不同类"的两个物体合起来。
                            # 治的是同一张沙发在不同帧被检成 sofa/bed/chair 留下一堆重影。
                            # 实测同一场景关着 13 个物体、开着 10 个，开着更接近真实
  cross_label_overlap: 0.7  # 上面那条的门槛，比同类的 0.5 高很多：类别不同本身就是
                            # "不是一个东西"的证据，要推翻它几何证据得非常硬
  split_min_frac: 0.3     # 一个物体里分出的簇各占 30% 以上才考虑拆
  split_dist: 1.0         # 且两簇质心相距超过 1 米才拆（修"两把椅子被并成一把"）
  floor_z_span: 0.08      # 高度跨度不到 8 cm
  floor_area: 4.0         # 且水平面积超过 4 平方米 -> 认成地板/墙面，丢掉
  keep_structure: false   # 设成 true 就不丢地板和墙
